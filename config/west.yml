manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: BFotouh
      url-base: https://github.com/BFotouh
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # Fork of badjeff/zmk-output-behavior-listener fixing a multi-instance
    # bug (DEVICE_DT_INST_DEFINE hardcoded instance 0) that breaks as
    # soon as a build has two nodes of the same output compatible - we
    # hit this with two zmk,output-split-output-relay proxies (haptic +
    # piezo). See that repo's commit log for details.
    - name: zmk-output-behavior-listener
      remote: BFotouh
      revision: main
    # Fork of badjeff/zmk-drv2605-driver with the DT compatible string
    # renamed ti,drv2605 -> badjeff,drv2605 to avoid colliding with
    # Zephyr's own native ti,drv2605 haptics binding - see that repo's
    # README for details.
    - name: zmk-drv2605-driver
      remote: BFotouh
      revision: main
    - name: zmk-split-peripheral-output-relay
      remote: badjeff
      revision: main
  self:
    path: config
