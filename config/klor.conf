# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Display and RGB underglow are both enabled per-shield in
# Kconfig.defconfig instead of here - only klor_left/klor_right have
# that hardware (an OLED, an LED strip); the dongle has neither, and
# each would fail to build with no matching chosen node.
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=40

# Keep the OLED always on - a Kconfig.defconfig "default n" for this
# symbol did NOT take effect (verified via CI: still built as =y), so
# forcing it here instead, which does. Harmless on the dongle (no
# CONFIG_ZMK_DISPLAY there, so this has nothing to act on).
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
